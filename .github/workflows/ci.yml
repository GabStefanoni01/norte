name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  backend-test:
    name: Backend — testes
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: norte
          POSTGRES_PASSWORD: norte
          POSTGRES_DB: norte
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://norte:norte@localhost:5432/norte
      JWT_SECRET: ci-only-secret-nunca-usar-em-producao-0123456789abcdef
      NODE_ENV: test
      INTEGRATION_TESTS: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        working-directory: backend
        run: npm install

      - name: Rodar migrations
        working-directory: backend
        run: npm run migrate

      - name: Rodar testes
        working-directory: backend
        run: npm test

      - name: Checar sintaxe de todos os arquivos .js
        working-directory: backend
        run: find src -name "*.js" -exec node --check {} \;

  frontend-build:
    name: Frontend — build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npx ng build --configuration development

  e2e:
    name: E2E — fluxo principal
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: norte
          POSTGRES_PASSWORD: norte
          POSTGRES_DB: norte
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://norte:norte@localhost:5432/norte
      JWT_SECRET: ci-only-secret-nunca-usar-em-producao-0123456789abcdef
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências do backend
        working-directory: backend
        run: npm install

      - name: Rodar migrations
        working-directory: backend
        run: npm run migrate

      - name: Preparar dados do E2E
        working-directory: backend
        run: node tests/e2e/prepare.js

      - name: Instalar dependências do frontend
        working-directory: frontend
        run: npm ci

      - name: Instalar Chromium
        working-directory: frontend
        run: npx playwright@1.55.0 install --with-deps chromium

      - name: Subir backend
        working-directory: backend
        run: |
          npm start > /tmp/norte-backend.log 2>&1 &
          echo $! > /tmp/norte-backend.pid

      - name: Aguardar backend
        run: |
          curl --retry 30 --retry-delay 1 --fail http://127.0.0.1:3000/health

      - name: Subir frontend
        working-directory: frontend
        run: |
          npm start -- --host 127.0.0.1 > /tmp/norte-frontend.log 2>&1 &
          echo $! > /tmp/norte-frontend.pid

      - name: Aguardar frontend
        run: |
          curl --retry 30 --retry-delay 1 --fail http://127.0.0.1:4200/

      - name: Executar E2E
        working-directory: frontend
        run: npx playwright@1.55.0 test -c e2e/playwright.config.js

      - name: Logs do backend em caso de falha
        if: failure()
        run: cat /tmp/norte-backend.log || true

      - name: Logs do frontend em caso de falha
        if: failure()
        run: cat /tmp/norte-frontend.log || true

      - name: Limpar dados do E2E
        if: always()
        working-directory: backend
        run: node tests/e2e/cleanup.js
