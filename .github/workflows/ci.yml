name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  backend-test:
    name: Backend — testes
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: norte
          POSTGRES_PASSWORD: norte
          POSTGRES_DB: norte
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://norte:norte@localhost:5432/norte
      JWT_SECRET: ci-only-secret-nunca-usar-em-producao-0123456789abcdef
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        working-directory: backend
        run: npm install

      - name: Rodar migrations
        working-directory: backend
        run: npm run migrate

      - name: Rodar testes
        working-directory: backend
        run: npm test

      - name: Checar sintaxe de todos os arquivos .js
        working-directory: backend
        run: find src -name "*.js" -exec node --check {} \;

  frontend-build:
    name: Frontend — build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npx ng build --configuration development
