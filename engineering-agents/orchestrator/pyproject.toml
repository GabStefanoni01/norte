[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "norte-engineering-orchestrator"
version = "0.1.0"
description = "LangGraph orchestration service for Norte Engineering Agents"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0,<2.0",
  "pydantic>=2.8,<3.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
addopts = "-q"
