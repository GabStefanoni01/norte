<footer class="px-6 py-12 md:px-12 border-t border-norte-800">
  <div class="mx-auto max-w-5xl">
    <div class="flex flex-col sm:flex-row justify-between gap-8 mb-8">
      <div class="flex items-center gap-2">
        <norte-logo-mark [tamanho]="24" />
        <span class="font-display text-lg text-norte-accent-light">Norte</span>
      </div>

      <nav class="flex flex-wrap gap-x-6 gap-y-2 text-sm text-white/50">
        <a routerLink="/sobre" class="hover:text-white transition-colors">Sobre</a>
        <a routerLink="/contato" class="hover:text-white transition-colors">Contato</a>
        <a routerLink="/politica-de-privacidade" class="hover:text-white transition-colors">Política de Privacidade</a>
        <a routerLink="/termos-de-uso" class="hover:text-white transition-colors">Termos de Uso</a>
      </nav>
    </div>

    <div class="flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-white/40 pt-6 border-t border-norte-800">
      <span>© {{ anoAtual }} Norte — encontre seu norte. Desenvolvido por Norte.</span>
      <a
        [href]="instagramUrl"
        target="_blank"
        rel="noopener noreferrer"
        class="flex items-center gap-1.5 hover:text-norte-accent-light transition-colors"
      >
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="3" width="18" height="18" rx="5" />
          <circle cx="12" cy="12" r="4" />
          <circle cx="17.5" cy="6.5" r="0.8" fill="currentColor" stroke="none" />
        </svg>
        Instagram
      </a>
    </div>
  </div>
</footer>
