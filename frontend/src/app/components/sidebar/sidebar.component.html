<aside
  class="group fixed left-0 top-0 z-40 flex h-screen w-16 hover:w-56 flex-col overflow-hidden border-r border-norte-800 bg-norte-950 transition-all duration-300 ease-out"
>
  <!-- Logo -->
  <a routerLink="/dashboard" class="flex items-center gap-3 px-4 py-5 shrink-0">
    <norte-logo-mark [tamanho]="32" />
    <span class="font-display text-lg text-norte-accent-light opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap">
      Norte
    </span>
  </a>

  <!-- Navegação -->
  <nav class="flex-1 flex flex-col gap-1 px-3 mt-2">
    <a
      routerLink="/dashboard"
      routerLinkActive="bg-norte-900 text-white"
      [routerLinkActiveOptions]="{ exact: true }"
      class="flex items-center gap-3 rounded-lg px-2.5 py-2.5 text-white/60 hover:text-white hover:bg-norte-900/60 transition-colors"
    >
      <svg class="shrink-0" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7" rx="1.5" /><rect x="14" y="3" width="7" height="7" rx="1.5" />
        <rect x="3" y="14" width="7" height="7" rx="1.5" /><rect x="14" y="14" width="7" height="7" rx="1.5" />
      </svg>
      <span class="text-sm whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity">Dashboard</span>
    </a>

    <a
      routerLink="/plano"
      routerLinkActive="bg-norte-900 text-white"
      class="flex items-center gap-3 rounded-lg px-2.5 py-2.5 text-white/60 hover:text-white hover:bg-norte-900/60 transition-colors"
    >
      <svg class="shrink-0" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 21V3" /><path d="M6 4l10 3-10 3" />
      </svg>
      <span class="text-sm whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity">Meu plano</span>
    </a>

    <a
      routerLink="/descoberta"
      routerLinkActive="bg-norte-900 text-white"
      class="flex items-center gap-3 rounded-lg px-2.5 py-2.5 text-white/60 hover:text-white hover:bg-norte-900/60 transition-colors"
    >
      <svg class="shrink-0" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="12" r="9" />
        <path d="M14.5 9.5 L11 13 L9.5 14.5 L13 11 Z" fill="currentColor" stroke="none" />
      </svg>
      <span class="text-sm whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity">Descoberta</span>
    </a>

    <a
      routerLink="/chat"
      routerLinkActive="bg-norte-900 text-white"
      class="flex items-center gap-3 rounded-lg px-2.5 py-2.5 text-white/60 hover:text-white hover:bg-norte-900/60 transition-colors"
    >
      <svg class="shrink-0" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 5h16v10H8l-4 4V5Z" />
      </svg>
      <span class="text-sm whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity">Mentor IA</span>
    </a>

    <a
      routerLink="/carreira"
      routerLinkActive="bg-norte-900 text-white"
      class="flex items-center gap-3 rounded-lg px-2.5 py-2.5 text-white/60 hover:text-white hover:bg-norte-900/60 transition-colors"
    >
      <svg class="shrink-0" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 6h16M4 12h16M4 18h16" />
      </svg>
      <span class="text-sm whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity">Carreira</span>
    </a>

    <a
      routerLink="/curriculo"
      routerLinkActive="bg-norte-900 text-white"
      class="flex items-center gap-3 rounded-lg px-2.5 py-2.5 text-white/60 hover:text-white hover:bg-norte-900/60 transition-colors"
    >
      <svg class="shrink-0" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
        <path d="M12 2 L14.5 8.5 L21.5 9 L16 13.5 L18 20.5 L12 16.5 L6 20.5 L8 13.5 L2.5 9 L9.5 8.5 Z" />
      </svg>
      <span class="text-sm whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity">Conquistas</span>
    </a>

    <a
      routerLink="/perfil"
      routerLinkActive="bg-norte-900 text-white"
      class="flex items-center gap-3 rounded-lg px-2.5 py-2.5 text-white/60 hover:text-white hover:bg-norte-900/60 transition-colors"
    >
      <svg class="shrink-0" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="4" /><path d="M4 21c0-4 4-7 8-7s8 3 8 7" />
      </svg>
      <span class="text-sm whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity">Perfil</span>
    </a>

    @if (auth.ehAdmin()) {
      <a
        routerLink="/admin"
        routerLinkActive="bg-norte-900 text-white"
        class="flex items-center gap-3 rounded-lg px-2.5 py-2.5 text-norte-accent-light/80 hover:text-norte-accent-light hover:bg-norte-900/60 transition-colors"
      >
        <svg class="shrink-0" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
          <path d="M12 2 L20 5 V11 C20 16 16.5 20 12 22 C7.5 20 4 16 4 11 V5 Z" />
        </svg>
        <span class="text-sm whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity">Admin</span>
      </a>
    }
  </nav>

  <!-- Usuário / sair -->
  <div class="px-3 py-4 border-t border-norte-800">
    <button
      (click)="auth.logout()"
      class="flex items-center gap-3 rounded-lg px-2.5 py-2.5 w-full text-white/40 hover:text-white hover:bg-norte-900/60 transition-colors"
    >
      <svg class="shrink-0" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 5H5a2 2 0 00-2 2v10a2 2 0 002 2h4M16 15l4-4-4-4M20 11H9" />
      </svg>
      <span class="text-sm whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity">Sair</span>
    </button>
  </div>
</aside>
