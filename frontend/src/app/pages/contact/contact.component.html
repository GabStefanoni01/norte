<main class="min-h-screen bg-norte-950 text-white">
  <header class="border-b border-white/[0.06]">
    <div class="mx-auto flex h-20 max-w-7xl items-center justify-between px-5 sm:px-8 lg:px-10">
      <a routerLink="/" class="flex items-center gap-2.5" aria-label="Norte - início">
        <norte-logo-mark [tamanho]="30" />
        <span class="font-display text-2xl">Norte</span>
      </a>
      <a routerLink="/" class="rounded-lg px-3 py-2 text-sm text-white/55 transition hover:bg-white/[0.04] hover:text-white">← Voltar ao início</a>
    </div>
  </header>

  <section class="px-5 py-14 sm:px-8 sm:py-20 lg:px-10 lg:py-24">
    <div class="mx-auto max-w-5xl">
      <div class="grid gap-10 lg:grid-cols-[0.8fr_1.2fr] lg:gap-20 lg:items-start">
        <div class="lg:pt-4">
          <p class="norte-eyebrow">Contato</p>
          <h1 class="mt-4 font-display text-4xl leading-tight tracking-tight sm:text-5xl">Fale com a gente.</h1>
          <p class="mt-5 max-w-sm text-[15px] leading-7 text-white/50">
            Dúvida, sugestão ou proposta? Envie uma mensagem. Queremos ouvir quem está construindo essa jornada com a gente.
          </p>

          <div class="mt-10 border-t border-white/[0.08] pt-6">
            <p class="text-xs uppercase tracking-[0.16em] text-white/30">Norte</p>
            <p class="mt-2 text-sm text-white/55">Encontre seu norte.</p>
          </div>
        </div>

        <section class="norte-card border-white/10 bg-norte-900/70 p-6 sm:p-8" aria-labelledby="contact-form-title">
          <div class="mb-7">
            <p class="norte-eyebrow">Mensagem</p>
            <h2 id="contact-form-title" class="mt-2 text-xl font-semibold">Como podemos ajudar?</h2>
          </div>

          <form [formGroup]="form" (ngSubmit)="enviar()" class="space-y-5">
            <div>
              <label class="mb-2 block text-sm font-medium text-white/80" for="nome">Nome</label>
              <input id="nome" type="text" formControlName="nome" autocomplete="name"
                class="w-full rounded-xl border border-white/10 bg-norte-950/70 px-4 py-3 text-white outline-none transition placeholder:text-white/25 focus:border-norte-accent/60 focus:ring-2 focus:ring-norte-accent/20"
                placeholder="Seu nome" />
            </div>

            <div>
              <label class="mb-2 block text-sm font-medium text-white/80" for="email">E-mail</label>
              <input id="email" type="email" formControlName="email" autocomplete="email"
                class="w-full rounded-xl border border-white/10 bg-norte-950/70 px-4 py-3 text-white outline-none transition placeholder:text-white/25 focus:border-norte-accent/60 focus:ring-2 focus:ring-norte-accent/20"
                placeholder="voce@exemplo.com" />
            </div>

            <div>
              <label class="mb-2 block text-sm font-medium text-white/80" for="mensagem">Mensagem</label>
              <textarea id="mensagem" formControlName="mensagem" rows="6"
                class="w-full resize-y rounded-xl border border-white/10 bg-norte-950/70 px-4 py-3 text-white outline-none transition placeholder:text-white/25 focus:border-norte-accent/60 focus:ring-2 focus:ring-norte-accent/20"
                placeholder="Escreva sua mensagem..."></textarea>
            </div>

            @if (erro()) {
              <div class="rounded-xl border border-red-400/20 bg-red-400/5 px-4 py-3 text-sm text-red-300" role="alert">{{ erro() }}</div>
            }

            @if (sucesso()) {
              <div class="rounded-xl border border-emerald-400/20 bg-emerald-400/5 px-4 py-3 text-sm text-emerald-300" role="status">{{ sucesso() }}</div>
            }

            <button type="submit" [disabled]="enviando()"
              class="norte-button-primary w-full justify-center rounded-xl py-3.5 text-sm disabled:cursor-not-allowed disabled:opacity-60">
              {{ enviando() ? 'Enviando...' : 'Enviar mensagem' }}
            </button>
          </form>
        </section>
      </div>
    </div>
  </section>

  <norte-footer />
</main>
