<header class="relative z-10 flex items-center justify-between px-6 py-6 md:px-12">
  <a routerLink="/" class="flex items-center gap-2">
    <norte-logo-mark [tamanho]="28" />
    <span class="font-display text-2xl text-norte-accent-light">Norte</span>
  </a>
  <a routerLink="/" class="text-sm text-white/60 hover:text-white transition-colors">← Voltar ao início</a>
</header>

<section class="relative overflow-hidden px-6 py-16 md:px-12">
  <norte-starfield />

  <div class="stagger relative z-10 mx-auto max-w-lg">
    <p class="text-sm uppercase tracking-[0.2em] text-norte-accent-light/80 mb-4">Contato</p>
    <h1 class="font-display text-4xl mb-3">Fale com a gente</h1>
    <p class="text-white/60 mb-10">Dúvida, sugestão ou proposta? Manda uma mensagem que a gente responde.</p>

    <div class="card-glow rounded-2xl border border-norte-700/60 bg-norte-900/60 backdrop-blur-sm p-8">
      <form [formGroup]="form" (ngSubmit)="enviar()" class="stagger space-y-4">
        <div>
          <label class="block text-sm text-white/70 mb-1" for="nome">Nome</label>
          <input
            id="nome"
            type="text"
            formControlName="nome"
            class="w-full rounded-md bg-norte-950/60 border border-norte-700 px-4 py-2.5 text-white placeholder-white/30 focus:outline-none focus:ring-2 focus:ring-norte-accent"
            placeholder="Seu nome"
          />
        </div>

        <div>
          <label class="block text-sm text-white/70 mb-1" for="email">E-mail</label>
          <input
            id="email"
            type="email"
            formControlName="email"
            class="w-full rounded-md bg-norte-950/60 border border-norte-700 px-4 py-2.5 text-white placeholder-white/30 focus:outline-none focus:ring-2 focus:ring-norte-accent"
            placeholder="voce@exemplo.com"
          />
        </div>

        <div>
          <label class="block text-sm text-white/70 mb-1" for="mensagem">Mensagem</label>
          <textarea
            id="mensagem"
            formControlName="mensagem"
            rows="5"
            class="w-full rounded-md bg-norte-950/60 border border-norte-700 px-4 py-2.5 text-white placeholder-white/30 focus:outline-none focus:ring-2 focus:ring-norte-accent"
            placeholder="Como podemos ajudar?"
          ></textarea>
        </div>

        @if (erro()) {
          <p class="text-sm text-red-400">{{ erro() }}</p>
        }

        @if (sucesso()) {
          <p class="text-sm text-emerald-400">{{ sucesso() }}</p>
        }

        <button
          type="submit"
          [disabled]="enviando()"
          class="btn-shine w-full rounded-md bg-norte-accent hover:bg-norte-accent-light hover:shadow-[0_0_20px_rgba(224,169,68,0.35)] transition-all duration-200 text-norte-950 font-semibold py-2.5 disabled:opacity-60"
        >
          {{ enviando() ? 'Enviando...' : 'Enviar mensagem' }}
        </button>
      </form>
    </div>
  </div>
</section>

<norte-footer />
