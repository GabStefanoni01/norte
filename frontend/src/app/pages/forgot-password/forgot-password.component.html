<main class="min-h-screen bg-norte-950 px-4 py-10 sm:py-14">
  <div class="mx-auto flex min-h-[80vh] w-full max-w-md flex-col justify-center">
    <header class="mb-8 text-center">
      <a routerLink="/" class="inline-flex items-center gap-3" aria-label="Voltar para o início">
        <norte-logo-mark [tamanho]="42" />
        <span class="font-display text-3xl text-norte-accent-light">Norte</span>
      </a>
      <p class="mt-3 text-sm text-white/50">Encontre seu norte.</p>
    </header>

    <section class="norte-card border-white/10 bg-norte-900/80 p-6 sm:p-8">
      <div class="mb-7">
        <p class="norte-eyebrow">Acesso à conta</p>
        <h1 class="mt-2 text-2xl font-semibold tracking-tight text-white">Recupere seu acesso</h1>
        <p class="mt-3 text-sm leading-6 text-white/50">
          Informe o e-mail da sua conta. Se ele existir, enviaremos um código para redefinir sua senha.
        </p>
      </div>

      <form [formGroup]="form" (ngSubmit)="enviar()" class="space-y-5">
        <div>
          <label class="mb-2 block text-sm font-medium text-white/80" for="email">E-mail</label>
          <input id="email" type="email" formControlName="email" autocomplete="email"
            class="w-full rounded-xl border border-white/10 bg-norte-950/70 px-4 py-3 text-white outline-none transition placeholder:text-white/25 focus:border-norte-accent/60 focus:ring-2 focus:ring-norte-accent/20"
            placeholder="voce@exemplo.com" />
        </div>

        @if (erro()) {
          <div class="rounded-xl border border-red-400/20 bg-red-400/5 px-4 py-3 text-sm text-red-300" role="alert">{{ erro() }}</div>
        }

        <button type="submit" [disabled]="carregando()"
          class="norte-button-primary w-full justify-center rounded-xl py-3.5 text-sm disabled:cursor-not-allowed disabled:opacity-60">
          {{ carregando() ? 'Enviando...' : 'Enviar código' }}
        </button>
      </form>
    </section>

    <p class="mt-6 text-center text-sm text-white/45">
      <a routerLink="/entrar" class="font-medium text-norte-accent-light hover:underline">Voltar para o login</a>
    </p>
  </div>
</main>
