<main class="relative min-h-screen overflow-hidden flex items-center justify-center px-4">
  <norte-starfield />

  <div class="stagger relative z-10 w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="flex justify-center mb-1">
        <norte-logo-mark [tamanho]="40" />
      </div>
      <p class="font-display text-4xl text-norte-accent-light">Norte</p>
      <p class="text-white/60 mt-2">Vamos recuperar seu acesso.</p>
    </div>

    <div class="card-glow rounded-2xl border border-norte-700/60 bg-norte-900/60 backdrop-blur-sm p-8">
      <p class="text-sm text-white/60 mb-6">
        Informe o e-mail da sua conta. Se ele existir, enviaremos um código para redefinir sua senha.
      </p>

      <form [formGroup]="form" (ngSubmit)="enviar()" class="stagger space-y-4">
        <div>
          <label class="block text-sm text-white/70 mb-1" for="email">E-mail</label>
          <input
            id="email"
            type="email"
            formControlName="email"
            class="w-full rounded-md bg-norte-950/60 border border-norte-700 px-4 py-2.5 text-white placeholder-white/30 focus:outline-none focus:ring-2 focus:ring-norte-accent"
            placeholder="voce@exemplo.com"
          />
        </div>

        @if (erro()) {
          <p class="text-sm text-red-400">{{ erro() }}</p>
        }

        <button
          type="submit"
          [disabled]="carregando()"
          class="btn-shine w-full rounded-md bg-norte-accent hover:bg-norte-accent-light hover:shadow-[0_0_20px_rgba(224,169,68,0.35)] hover:-translate-y-0.5 transition-all duration-200 text-norte-950 font-semibold py-2.5 disabled:opacity-60 disabled:hover:shadow-none disabled:hover:translate-y-0 active:scale-[0.98]"
        >
          {{ carregando() ? 'Enviando...' : 'Enviar código' }}
        </button>
      </form>
    </div>

    <p class="text-center text-sm text-white/50 mt-6">
      <a routerLink="/entrar" class="text-norte-accent-light hover:underline">Voltar para o login</a>
    </p>
  </div>
</main>
