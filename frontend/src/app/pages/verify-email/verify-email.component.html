<main class="min-h-screen bg-norte-950 px-4 py-10 sm:py-14">
  <div class="mx-auto flex min-h-[80vh] w-full max-w-md flex-col justify-center">
    <header class="mb-8 text-center">
      <a routerLink="/" class="inline-flex items-center gap-3" aria-label="Voltar para o início">
        <norte-logo-mark [tamanho]="42" />
        <span class="font-display text-3xl text-norte-accent-light">Norte</span>
      </a>
      <p class="mt-3 text-sm text-white/50">Encontre seu norte.</p>
    </header>

    <section class="norte-card border-white/10 bg-norte-900/80 p-6 sm:p-8">
      <div class="mb-7 text-center">
        <div class="mx-auto mb-5 flex h-12 w-12 items-center justify-center rounded-2xl border border-norte-accent/20 bg-norte-accent/10 text-norte-accent-light">
          <span class="text-xl">✉</span>
        </div>
        <p class="norte-eyebrow">Verificação</p>
        <h1 class="mt-2 text-2xl font-semibold tracking-tight text-white">Confirme seu e-mail</h1>
        <p class="mt-3 text-sm leading-6 text-white/50">
          Enviamos um código de 6 dígitos para
          @if (email()) { <span class="text-white/80">{{ email() }}</span> } @else { seu e-mail }.
        </p>
      </div>

      <form [formGroup]="form" (ngSubmit)="confirmar()" class="space-y-5">
        <div>
          <label class="mb-2 block text-sm font-medium text-white/80" for="codigo">Código de confirmação</label>
          <input id="codigo" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code"
            formControlName="codigo"
            class="w-full rounded-xl border border-white/10 bg-norte-950/70 px-4 py-4 text-center text-2xl tracking-[0.45em] text-white outline-none transition placeholder:text-white/15 focus:border-norte-accent/60 focus:ring-2 focus:ring-norte-accent/20"
            placeholder="000000" />
        </div>

        @if (erro()) {
          <div class="rounded-xl border border-red-400/20 bg-red-400/5 px-4 py-3 text-sm text-red-300" role="alert">{{ erro() }}</div>
        }
        @if (sucesso()) {
          <div class="rounded-xl border border-emerald-400/20 bg-emerald-400/5 px-4 py-3 text-sm text-emerald-300" role="status">{{ sucesso() }}</div>
        }

        <button type="submit" [disabled]="carregando()"
          class="norte-button-primary w-full justify-center rounded-xl py-3.5 text-sm disabled:cursor-not-allowed disabled:opacity-60">
          {{ carregando() ? 'Confirmando...' : 'Confirmar e-mail' }}
        </button>
      </form>

      <button type="button" (click)="reenviarCodigo()" [disabled]="reenviando()"
        class="mt-5 w-full text-center text-sm text-white/45 transition-colors hover:text-norte-accent-light disabled:opacity-50">
        {{ reenviando() ? 'Reenviando...' : 'Não recebeu o código? Reenviar' }}
      </button>
    </section>

    <p class="mt-6 text-center text-sm text-white/45">
      <a routerLink="/entrar" class="font-medium text-norte-accent-light hover:underline">Voltar para o login</a>
    </p>
  </div>
</main>
